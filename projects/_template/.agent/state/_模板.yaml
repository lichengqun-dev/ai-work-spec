# 批次状态文件模板
#
# 复制到 projects/<项目码>/.agent/state/<批次号>.yaml
# 批次号格式：<项目码大写>-<YYYYMMDD>-<三位序号>，如 PROJ-20261019-001
#
# 本文件是**断点续做能力的载体**：接手一个批次时先读它，
# 不需要读任何文档就知道卡在哪一步、上一步产出了什么、有什么没解决的问题。
#
# ⚠️ **本文件是机器所有的：注释活不过第一次门禁回写。**
#
# `ai-gate-runner` 每次执行都用 PyYAML 重新序列化整个文件（`yaml.safe_dump`），
# 于是你在这里写的注释、空行、字段顺序**在第一次跑门禁后全部消失**。
#
# 后果与对策：
#   · 本模板的注释是给**你填的时候**看的，填完就完成使命了——不必惋惜
#   · 但**任何需要长期留存的信息必须写成字段**（如 `judgement`、`note`、`reason`），
#     写成注释等于没写。真实案例：首批评次把「路径判定理由」写成文件末尾的注释块，
#     跑一次 gate-01 后整段消失，而那是判断"为什么这个批次是新建而不是迭代"的唯一记录。
#   · 时间戳也会被重写成 PyYAML 的格式（`2026-10-20 17:23:39+08:00`，T 变空格），属正常现象
#
# 所以：**新增字段可以，新增注释只当临时草稿。**

batch: <批次号>
project: <项目码>
type: new                  # new | resume | change
created: <ISO8601 带时区>
owner: <批次负责人>
current_step: init         # **必须**是下方 steps 中某个 name，取值域固定（见文件末尾）

# ── 批次路径判定 ──────────────────────────────────────────
# 由 ai-requirement-00-intake 写入（它创建本文件，所以不是 steps 里的一个 step）。
# **这一段是必须的**：它回答「为什么这个批次走新建而不是迭代」——判错了要么跳过该走的环节，
# 要么让小事走重流程。**不要写成注释**（见文件头的警告），注释活不过第一次门禁回写。
# reason 写判定依据，不是结论复述：「因为是新功能」不合格；
# 「状态目录下无已归档批次 → 该项目在本知识库尚无基线 → 需走完整流程」合格。
judgement:
  by: <判定者：写 Skill 名，如 ai-requirement-00-intake>
  at: <ISO8601 带时区>
  type: new                # new | resume | change，须与上方 type 一致
  reason: <判定依据，可多行>

# ── 生效规范快照 ──────────────────────────────────────────
# 回答"这个批次开发时用的是哪版规范"
# 取 projects/<项目码>/.agent/spec-effective/<项目码>.json 的 snapshot_hash 字段
# （内容寻址：改一条规范它就变，调整版式它不变；与 projects/<项目码>/.agent/logs/spec-build.jsonl 记录的值一致）
spec_snapshot:
  path: projects/<项目码>/.agent/spec-effective/<项目码>.md
  hash: <snapshot_hash>
  built_at: <ISO8601>

# ── 契约冻结 ──────────────────────────────────────────────
# gate-03 通过后由 ai-design-06-review 写入。冻结后任何变更走变更子批次。
# 「契约冻结」此前只写在文档里、状态文件里没有对应字段，于是"这批用的是哪版契约"无从回答。
contract_freeze:
  path: <需求名>/02_设计/接口契约.yaml
  hash: <sha256>           # 冻结那一刻的契约哈希
  frozen_at: <ISO8601>
  frozen_by: <人名>

# ── 步骤 ─────────────────────────────────────────────────
# **完整列出本路径要走的所有步骤。**
# 不适用的步骤不要删掉，标 status: skipped 并写明原因——
# 删掉会让「这一步没做过」变成不可见，而"没做的部分"恰恰是接手的人最需要知道的。
#
# 三条路径的步骤集：
#   新建（new）     = 全部 23 步（下表完整列出）
#   迭代（change）  = arch(增量) → detail(增量) → api(增量) → backend/frontend → unittest
#                     → codereview → cases → automation → test-execute → regression
#                     → test-report → release → archive   （其余标 skipped）
#   快车道         = 不经本文件（走 projects/<项目码>/.agent/index/快车道台账.md）
#
# 门禁不在 steps 里，它们卡在阶段边界上，位置如下：
#   gate-01 在 init 之后 · gate-02 在 prototype 之后 · gate-03 在 design-review 之后
#   gate-04 在 docsync 之后 · **gate-05 在 release 之后**（它要校验 release 产出的上线方案）
#   gate-06 在 archive 时
#
# `version` 取自对应 Skill 的 frontmatter。只有 step 1 写了示例，其余按需补。
steps:
  # ── 需求段（init 之前还有 ai-requirement-00-intake 的路径判定，
  #            它创建本文件，所以不列为 step）──
  - name: init
    skill: ai-requirement-01-init
    version: 2.5.0
    status: pending         # pending | in_progress | done | skipped | failed
    started: null
    finished: null
  - name: analysis
    skill: ai-requirement-02-analysis
    status: pending
  - name: prototype
    skill: ai-requirement-03-prototype
    status: pending
  - name: prd
    skill: ai-requirement-04-prd
    status: pending
  # ── 设计段 ──
  - name: arch
    skill: ai-design-01-arch
    status: pending
  - name: detail
    skill: ai-design-02-detail
    status: pending
  - name: db
    skill: ai-design-03-db
    status: pending
  - name: api
    skill: ai-design-04-api
    status: pending
  - name: frontend-spec
    skill: ai-design-05-frontend-spec
    status: pending
  - name: design-review
    skill: ai-design-06-review
    status: pending
  # ── 编码段 ──
  - name: scaffold
    skill: ai-dev-01-scaffold
    status: pending
  - name: backend
    skill: ai-dev-02-backend
    status: pending
  - name: frontend
    skill: ai-dev-03-frontend
    status: pending
  - name: unittest
    skill: ai-dev-04-unittest
    status: pending
  - name: codereview
    skill: ai-dev-05-codereview
    status: pending
  - name: docsync
    skill: ai-dev-06-docsync
    status: pending
  # ── 测试段 ──
  - name: cases
    skill: ai-test-01-cases
    status: pending
  - name: automation
    skill: ai-test-02-automation
    status: pending
  - name: test-execute
    skill: ai-test-03-execute
    status: pending
  - name: regression
    skill: ai-test-04-regression
    status: pending
  - name: test-report
    skill: ai-test-05-report
    status: pending
  # ── 交付与归档 ──
  - name: release
    skill: ai-iteration-04-release
    status: pending
  - name: archive
    skill: ai-archive-01-close
    status: pending

gates:
  - id: gate-01
    status: pending         # pending | passed | failed | waived | pending_manual
    at: null
    by: null                # auto | <人名>
    note: null
    # 以下四段由 ai-gate-runner 写入，不手工维护
    checks: []              # 每个 auto 检查项的结果：pass / fail / skip / external + 明细
    manual_pending: []      # 标注「人」的检查项——执行器只列清单，不替你拍板
    block_skip: []          # **缺校验材料**而 skip 的 BLOCK 项 ID
                            #   —— 有内容时签核会被拒绝（签核的前提是「有人核对过了」，
                            #      材料不存在时无从核对）。只能补齐材料后重跑，或走 --waive
    external_pending: []    # **不在执行器职责内**的检查项 ID（如静态检查、覆盖率报告）
                            #   —— 它们**可以签核**，但签核时**必须**用 --evidence 说明证据在哪
    external_evidence: null # 签核时提交的证据说明。为 null 而 external_pending 非空 ⇒ 签核会被拒
  - id: gate-02
    status: pending
  - id: gate-03
    status: pending
  - id: gate-04
    status: pending
  - id: gate-05
    status: pending
  - id: gate-06
    status: pending

artifacts: []
# 示例：
# artifacts:
#   - path: <需求名>/01_需求/需求功能分析.md      # 相对 docs_repo（见 projects/<项目码>/.agent/project.yaml）
#     hash: sha256:ab12...
#     fr_ids: [FR-CORE-045, FR-CORE-046]
#     produced_by: ai-requirement-02-analysis@2.5.0
# 注意：目录型产出物（原型工程仓、代码仓）也可登记，执行器只核对存在性、不核对哈希。

pending_questions: []
# 示例：
# pending_questions:
#   - id: Q-001
#     question: 导出是否包含已归档数据？
#     affects: [REQ-CORE-012, FR-CORE-045]
#     need_answer_from: 业务方
#     raised_at: 2026-10-19T10:12:00+08:00

waivers: []
# 门禁豁免记录。豁免不自动续期，到期生成复查提醒。
# 示例：
# waivers:
#   - gate: gate-03
#     reason: 客户要求当日上线，契约变更待补
#     approved_by: 李四
#     at: 2026-10-19T18:00:00+08:00
#     review_at: 2026-10-26        # 复查日期，须晚于今天且在 90 天内（执行器会校验）
#                                  # ⚠️ 到期自动提醒尚未实现——复查看排期，靠人

archived: false            # 归档后置 true，文件转为只读

# ── 更新纪律 ─────────────────────────────────────────────
# 1. 只有 Skill 写本文件，不手工编辑（手工改动会导致产出物哈希校验失败）
# 2. 批次归档后本文件只读，**不得删除** —— 追溯链依赖它
# 3. steps 中 status=done 的步骤在续做时不重跑；若其产出物哈希变化，
#    提示"产出物被外部修改"，由人决定是否重跑
#
# ── current_step 取值域（固定，不得自造）─────────────────
#   init · analysis · prototype · prd
#   arch · detail · db · api · frontend-spec · design-review
#   scaffold · backend · frontend · unittest · codereview · docsync
#   cases · automation · test-execute · regression · test-report
#   release · archive
#
# 这个取值域此前没有定义，而 gate-06 的 state-steps-final 要求 current_step 精确匹配某个 step 名——
# 写个近义词（如 `design`、`dev`）就会让门禁失败，且失败原因不易自明。