# 项目 manifest 模板
#
# 用法：复制本目录到 projects/<项目码>/，按注释填写，然后调用 ai-spec-build
#       （说"接入 <项目码>"即可，不需要知道它的实现细节）
#
# 【最重要的约束】本文件不写任何规范正文，只写"选了哪些包"和"有哪些差异"。
# 一旦在 overrides 里粘贴包内规范的内容，这个项目就退化成了基线副本，
# 包更新再也影响不到它 —— 这正是分层设计要解决的问题本身。

project: <项目码小写>            # 必须与目录名一致，构建时会校验
name: <项目全名>
owner: <技术负责人>
updated: <YYYY-MM-DD>

# ── 仓库路径 ─────────────────────────────────────────────
# 都是可选的；只填 `repo` 一个也能跑（适用于所有内容在一个仓里的项目）。
#
# 为什么分开：这几类仓的角色不同，混用一个字段会让路径解析出错——
#   文档仓 → 产出物路径基准（PRD、设计、测试报告的所在地）
#   原型仓 → 原型相关检查项的扫描根（data-fr 覆盖率）
#   代码仓 → 提交格式、FR 关联、密钥扫描的根
# 双仓库模型（文档仓 + 独立原型工程仓）下，用同一个根会导致原型覆盖率判成假通过。
repo: <代码仓相对路径或绝对路径>          # 兜底：未填下面几项时，都用它
# docs_repo: <项目文档仓路径>
# prototype_repo: <原型工程仓路径>
# code_repo: <项目代码仓路径>              # 单个代码仓时用这个
# code_repos:                             # **多个代码仓**时用这个（前后端分仓是常态）
#   - <后端仓路径>
#   - <前端仓路径>
#
# `code_repos` 与 `code_repo` 二选一；两个都填时以 `code_repos` 为准。
# 分仓时**一定要把两个仓都列上**——提交格式、FR 关联、密钥扫描只扫列出来的仓，
# 漏掉的那个仓里的问题一句都不会报，且不留痕迹。

modules:
  XXX: <模块名>

# ── 技术栈包：每维度单选（domains 领域包可多选，见下方）─────────
# 可用包与版本见 09_资产库/规范包/INDEX.md
stacks:
  fe: fe-vue3-elementplus@0.1.0
  be: be-springboot3-java17@0.1.0
  db: db-dm8@0.1.0

# ── 领域包：多选，按优先级从上到下 ─────────────────────────
# 顺序是业务决策，不是技术偏好 —— 想清楚再填。
# 优先级高的包在条目冲突时胜出，裁决结果会记入快照的来源链。
domains: []

# ── 差异：覆盖 / 禁用 / 追加 ──────────────────────────────
# action 三种取值：
#   append   —— 在包条目后补充内容，不改原意（优先用这个）
#   disable  —— 本条目不适用于本项目，必须带 expires
#   override —— 替换包条目内容（会让本项目失去该条目的后续更新，谨慎使用）
overrides: []

# ── 项目特有条目 ─────────────────────────────────────────
# 只写"这个项目独有、别的项目不会有"的约束。
# 如果同一条约束后来出现在 3 个以上项目里，用 ai-spec-promote 提升为共享包条目。
# 编号前缀必须为 STD-PRJ-<项目码大写>-
project_only: []
