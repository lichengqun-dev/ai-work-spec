# 项目 manifest 模板
#
# 用法：复制本目录到 projects/<项目码>/，按注释填写，然后执行：
#   python3 00_工作空间配置/skills/ai-spec-build/scripts/spec_build.py --project <项目码>
#
# 【最重要的约束】本文件不写任何规范正文，只写"选了哪些包"和"有哪些差异"。
# 一旦在 overrides 里粘贴包内规范的内容，这个项目就退化成了基线副本，
# 包更新再也影响不到它 —— 这正是分层设计要解决的问题本身。

project: <项目码小写>            # 必须与目录名一致，构建时会校验
name: <项目全名>
owner: <技术负责人>
repo: <代码仓相对路径或绝对路径>
updated: <YYYY-MM-DD>

# ── 模块码 ───────────────────────────────────────────────
# 用于 REQ / FN / API / TBL 的编号，见 00_工作空间配置/命名与编号规范.md
modules:
  XXX: <模块名>

# ── 技术栈包：每维度单选（mw 维度可多选）─────────────────
# 可用包与版本见 09_资产库/规范包/INDEX.md
stacks:
  fe: fe-vue3-elementplus@0.1.0
  be: be-springboot3-java17@0.1.0
  db: db-dm8@0.1.0

# ── 领域包：多选，按优先级从上到下 ─────────────────────────
# 顺序是业务决策，不是技术偏好 —— 想清楚再填。
# 优先级高的包在条目冲突时胜出，裁决结果会记入快照的来源链。
domains: []

# ── 差异：覆盖 / 禁用 / 追加 ──────────────────────────────
# action 三种取值：
#   append   —— 在包条目后补充内容，不改原意（优先用这个）
#   disable  —— 本条目不适用于本项目，必须带 expires
#   override —— 替换包条目内容（会让本项目失去该条目的后续更新，谨慎使用）
overrides: []

# ── 项目特有条目 ─────────────────────────────────────────
# 只写"这个项目独有、别的项目不会有"的约束。
# 如果同一条约束后来出现在 3 个以上项目里，用 ai-spec-promote 提升为共享包条目。
# 编号前缀必须为 STD-PRJ-<项目码大写>-
project_only: []
