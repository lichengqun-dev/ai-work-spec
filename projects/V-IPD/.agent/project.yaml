# V-IPD 项目 manifest
#
# 【最重要的约束】本文件不写任何规范正文，只写"选了哪些包"和"有哪些差异"。
# 一旦在 overrides 里粘贴包内规范的内容，这个项目就退化成了基线副本，
# 包更新再也影响不到它 —— 这正是分层设计要解决的问题本身。

project: V-IPD            # 必须与目录名**逐字一致**（含大小写），构建时会校验
name: V-IPD（PowerProject 项目管理系统）
owner: AI研发
updated: 2026-10-20

# ── 仓库路径 ─────────────────────────────────────────────
# 相对路径以**知识库的父目录**为基准解析（即本仓库与两个代码仓的共同父目录）。
#
# 为什么分开：这几类仓的角色不同，混用一个字段会让路径解析出错——
#   文档仓 → 产出物路径基准（PRD、设计、测试报告的所在地）
#   代码仓 → 提交格式、FN 关联、密钥扫描的根
#
# 本项目的形态：**前后端分两个仓**，文档与知识库同仓（见下方说明），
# 没有独立的原型工程仓（存量系统的迭代不产出原型；需要时可再补 prototype_repo）。
#
# 注意 `docs_repo` 指向的是**项目的根**（不是某个需求目录）：
# 产出物登记成 `点检任务/01_需求/PRD.md` 这样的相对路径（含需求名），再拼到 `docs_repo` 上。
# 产出物**按需求聚合**：一个需求的全部产出物在 `projects/V-IPD/<需求名>/<阶段>/` 下，
# 而不是按阶段散在 `<需求名>/01_需求`、`<需求名>/02_设计`…（后者会让一个需求的东西混在五个目录里）。
docs_repo: ai-work-spec/projects/V-IPD

# 原型工程仓 = 原型相关检查项的扫描根（data-fn 覆盖率）。
# 原型由 ai-requirement-03-prototype 产出，落在该需求的 `原型/` 下，按批次分目录存
# （每批次独立副本，不覆盖历史批次的原型）。
prototype_repo: ai-work-spec/projects/V-IPD/点检任务/原型

code_repos:
  - pp-powerproject-extend              # 后端：9 个 Maven 模块
  - powerprojectforjava-frontend        # 前端：Vue 2 + Element UI
#
# 两个仓都要列上。提交格式、FN 关联、密钥扫描**只扫列出来的仓**——
# 漏掉的那个仓里的问题一句都不会报，且不留痕迹。

# ── 模块 ─────────────────────────────────────────────────
# 模块码用于功能编号 `FN-<模块码>-<三位>`，**一经启用不复用**。
#
# 前 7 个与后端 7 个业务服务一一对应。
# `TASK` 是**后加的**：点检任务改造的是「任务」能力，而任务不是某个业务模块私有的——
# `ExtendsTaskInfo` 实体、`AbstractExtendsTaskService`、`BusinessTaskLifecycleService`
# 都在 **`pp-common-root` 公共基座**里，各业务模块只是各自扩展。
# 所以它需要独立的码，否则要硬塞进某个业务模块，让后续所有 FN 编号归属失真。
modules:
  PERF: 性能
  EXP: 体验
  DVP: 设计验证（DVP&R）
  EISSUE: 体验问题
  SPART: 专项零部件
  COMP: 竞品
  CMF: 颜色 / 材质 / 工艺
  TASK: 任务能力（公共基座 pp-common-root 提供，各业务模块共用）

# ── 技术栈包：每维度单选（互斥）───────────────────────────
# 可用包与版本见 09_资产库/规范包/INDEX.md
#
# 这三行是**按代码实况选**的，不是照模板默认值填的：
#   fe —— frontend/package.json：vue 2.6.14 + element-ui 2.15.14 + ant-design-vue 1.7.8
#   be —— 根 pom.xml：java.version=1.8、spring-boot 2.6.13、spring-cloud-alibaba 2021.0.5.0
#   db —— 各模块 application*.yml：jdbc:postgresql + org.postgresql.Driver，库名 PowerProject6
stacks:
  fe: fe-vue2-elementui@0.1.0
  be: be-springboot2-java8@0.1.0
  db: db-gaussdb@0.1.0          # GaussDB（PostgreSQL 协议兼容）。**不是 db-dm8**，见下方说明

# `db` 维度两个包互斥，而它们有多条规则**方向相反**（标识符大小写查找、空串与 NULL、
# `FROM DUAL`、`CONCAT` 参数个数）。本项目实测为 GaussDB/PostgreSQL，选 `db-dm8` 会往快照里
# 注入一批在 PostgreSQL 下错误的约束——且因为不报错，很难被发现。

# ── 领域包：多选，按优先级从上到下 ─────────────────────────
# 顺序是业务决策，不是技术偏好 —— 想清楚再填。
# 知识库现有的两个领域包（platform-base / info-security）都是空骨架，
# 引用它们只会产生零条目，所以本阶段不声明。等对应负责人填充后再补。
domains: []

# ── 差异：覆盖 / 禁用 / 追加 ──────────────────────────────
# action 三种取值：
#   append   —— 在包条目后补充内容，不改原意（优先用这个）
#   disable  —— 本条目不适用于本项目，必须带 expires
#   override —— 替换包条目内容（会让本项目失去该条目的后续更新，谨慎使用）
overrides: []

# 已知的采用期差异，**刻意不加 override**，记录在此仅供知情：
#
#   · 提交信息：本项目两个仓都是 GitLab 合并流，历史提交用 `feat(dvpr): …`（带模块名而非 FN）
#     或 `🐛 FIX: …`（emoji 前缀）。这些不符合 STD-BASE-002 / 003。
#     不 override 的理由：知识库的追溯链依赖「提交带 FN」，为兼容历史而放宽基线，
#     等于把这条链从第一天起就断掉——而历史提交会自然滚出「最近 30 个提交」的检查窗口。
#     **做法是从本批次起按新约定提交**，不追溯改写历史。

# ── 项目特有条目 ─────────────────────────────────────────
# 只写"这个项目独有、别的项目不会有"的约束。
# 如果同一条约束后来出现在 3 个以上项目里，用 ai-spec-promote 提升为共享包条目。
# 编号前缀必须为 STD-PRJ-V-IPD-
#
# 条目正文统一写在同目录的 `项目特有规范.md` 里，此处保持为空数组
# （两个地方都能放，但分散会让"这个项目到底有哪些特例"变得要翻两处）。
project_only: []