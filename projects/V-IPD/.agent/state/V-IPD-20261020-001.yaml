judgement:
  by: ai-requirement-00-intake
  at: 2026-10-20 17:23:39+08:00
  type: new
  reason: "两条独立规则都指向「新建」：\n1. `projects/V-IPD/.agent/state/` 下没有 V-IPD 的任何已归档批次 —— 该项目尚无基线，需走完整流程。\n   这是\
    \ V-IPD 接入知识库后的第一个批次。\n2. 本次是「增加一个原来不存在的能力」（点检任务：新任务类型 + 自动/手动生成 +\n   反馈回写 + 页签挂载 + 100% 自动关闭），不是\"\
    修改已有功能的逻辑、规则或计算方式\"。\n注意与直觉的差异：虽然这是**已上线系统**的功能增强（口语上会说\"迭代\"），\n但路径判定看的是**知识库有没有该项目的基线**，不是系统本身新旧。\n\
    没有基线 → 走完整 23 步，把这个批次本身变成第一个基线。\n本次含少量「修改已有行为」的成分（FN-TASK-020 按钮替换、FN-TASK-021/022 字段精简），\n但它们不是主体，且都发生在本批次直接改动的代码路径上，不需要单独开变更子批次。\n"
spec_snapshot:
  path: projects/V-IPD/.agent/spec-effective/V-IPD.md
  hash: sha256:44cf64812b5756e6
  built_at: 2026-10-22T16:23:28+08:00
  note: '2026-10-22 刷新。本次**项目级条目一条都没改**，变的是编译机制：
    快照不再装域级内容（各域 standards/ 与技术栈包），只装项目级——
    域级回归「原文按阶段加载」，条目机制（tier/scope/frozen/覆盖/冲突仲裁）退役。
    项目级 29 条与上一版逐条一致（常驻 19），快照 102 行。
    哈希从 sha256:1c13687ed76dc38b 变为 sha256:44cf64812b5756e6 有两处原因：
    ① 组合声明指纹不再纳入 overrides（覆盖机制退役）→ sha256:2a504cb2b06fc8ce；
    ② 条目哈希改为按 id 排序，不再混入层级字段。
    **本批次产出物（PRD / 原型）是需求与交互层面的，不受影响，无需重校**；
    但设计段（arch）开工前**必须重读新快照**，并注意：域级规范现在要按各域 README 的
    「本阶段约束」表去读原文——**快照里没有它们**。
    ── 上一次刷新的记录（2026-10-21）──
    项目根散文文档整体换成了团队维护的真实版本（新增 java后端开发规范 / 前端开发规范 /
    测试方案-核心链路 / 测试环境与账号管理 V1.0 / 新人第一次用AI做全栈-注意事项，
    后端开发规范.md 与 环境与账号.md 已不存在）。按新散文重新提炼后，项目级条目
    8 → 29 条（新增 6 个提炼文件），生效条目 67 → 88 条（常驻 36 → 50，A 段 104/120 行）。
    **其中一条与旧条目方向相反**：旧 STD-PRJ-V-IPD-002 写「逻辑删除 1=未删 / 2=已删」，
    真实文档是「一期 deleted_ 取 N/Y；二期 is_delete/is_deleted **1=正常，0/2=删除**」——已按真文档改正。
    另：本批次产出物（PRD 与原型）是需求与交互层面的，不受上述编码/库表类约束影响，无需重校；
    但**设计段（arch）开工前应重读新快照**——新增的 29 条正是设计要遵守的约束。
    刷新前哈希 sha256:89616c3848b04593。'
